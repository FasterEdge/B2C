name: Build packages

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      arch: ${{ steps.arch.outputs.arch }}

    steps:
      - id: arch
        run: |
          if ${{ contains(fromJSON('["release", "workflow_dispatch"]'), github.event_name) }}; then
            echo "arch=[\"linux/amd64\", \"linux/arm64\"]" >> $GITHUB_OUTPUT
          else
            echo "arch=[\"linux/amd64\"]" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ${{ matrix.arch == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: prepare

    strategy:
      matrix:
        golang:
          - 1.26.11
        arch: ${{fromJson(needs.prepare.outputs.arch)}}
        os:
          - debian

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: build
      if: matrix.os == 'debian'
      run: |
        docker run -i --rm \
        -v $(pwd):/ekuiper \
        --workdir /ekuiper \
        --env KUIPER_SOURCE='/ekuiper' \
        --env GOTOOLCHAIN=auto \
        --platform ${{ matrix.arch }} \
        ghcr.io/lf-edge/ekuiper/base:${{ matrix.golang }}-${{ matrix.os }} \
        bash -euc "git config --global --add safe.directory /ekuiper && make pkg && make pkg_core && make pkg_full"
    - name: create sha file
      run: |
        cd _packages && for var in $(ls); do sudo bash -c "echo $(sha256sum $var | awk '{print $1}') > $var.sha256"; done && cd -
    - name: Set artifact name
      id: artifact_name
      env:
        ARCH: ${{ matrix.arch }}
        REF: ${{ github.ref_name }}
      run: |
        arch=$(echo $ARCH | sed -r 's|linux/([a-z]*)(/.*)*|\1|g')
        ref=$(echo ${REF/\//-})
        artifact_name="kuiper-${ref}-${{ matrix.os }}-${arch}"
        echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.artifact_name }}
        path: _packages/

  build-on-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    - name: prepare
      run: |
        brew install zip unzip gnu-sed zmq
          echo "/usr/local/bin:$PATH" >> ~/.bashrc
    - name: build
      run: |
        make pkg
        cd _packages && for var in $(ls); do openssl dgst -sha256 $var | awk '{print $2}' > $var.sha256; done && cd -
    - name: Set artifact name
      id: artifact_name
      env:
        REF: ${{ github.ref_name }}
      run: |
        arch=$(echo $ARCH | sed -r 's|linux/([a-z]*)(/.*)*|\1|g')
        ref=$(echo ${REF/\//-})
        artifact_name="kuiper-${ref}-darwin-${arch}"
        echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.artifact_name }}
        path: _packages/

  build-docker-images:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        suffix:
          - ""
          - "-alpine"
          - "-alpine-python"
          - "-dev"
          - "-slim"
          - "-slim-python"
          - "-full"
        golang:
          - 1.26.11

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: docker/setup-buildx-action@v3
    - uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:qemu-v9.2.2-52
        platforms: all
    - name: Resolve version
      id: ver
      run: |
        # .dockerignore 排除了 .git, 镜像内 git describe 不可用, 版本号必须从外部传入。
        v="${GITHUB_REF_NAME#v}"
        case "$v" in
          [0-9]*.[0-9]*.[0-9]*) ;;
          *) v="0.0.0-${GITHUB_SHA::7}" ;;
        esac
        echo "version=$v" >> $GITHUB_OUTPUT
    - name: Build single platform image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: docker.io/lfedge/ekuiper
        build-args: |
          GO_VERSION=${{ matrix.golang }}
          B2C_VERSION=${{ steps.ver.outputs.version }}
        file: deploy/docker/Dockerfile${{ matrix.suffix }}
    - name: Test docker image
      run: |
        # REST API binds to 127.0.0.1 by default for security.
        # Expose it on all interfaces for the smoke test, which reaches it
        # from the host via the container's bridge network address.
        docker run -d -e KUIPER__BASIC__RESTIP=0.0.0.0 --name ekuiper docker.io/lfedge/ekuiper
        ip_address=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ekuiper)
        sleep 5
        if ! curl ${ip_address}:9081  >/dev/null 2>&1; then
            echo "docker image failed"
            docker logs ekuiper
            exit 1
        fi
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: docker.io/lfedge/ekuiper
        flavor: |
          latest=${{ github.event_name == 'release' && matrix.suffix == '-alpine'  && !github.event.release.prerelease}}
          suffix=${{ matrix.suffix }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Check registry credentials
      id: creds
      env:
        HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      run: |
        # 本 fork 没有 docker.io 凭据。缺凭据时 docker/login-action 会直接
        # "Username and password required" 失败, 连带整个 Build packages 变红,
        # 发布包里连二进制都拿不到。这里先探测, 缺凭据就把推送降级为只构建。
        if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "::warning::DOCKER_HUB_USER / DOCKER_HUB_TOKEN 未配置，跳过镜像推送，只构建并跑冒烟测试"
        fi
    - uses: docker/login-action@v2
      if: github.event_name == 'release' && steps.creds.outputs.available == 'true'
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    # 这一层只为推送多架构镜像存在。没有推送凭据时它仍会跨 amd64/arm64/armv7
    # 完整编一遍再丢掉产物，单次能跑掉一小时以上，所以只在真要推送时才执行；
    # 单平台构建 + 冒烟测试在上面已经做过，验收不打折。
    - name: Build multi platform image
      if: contains(fromJSON('["release", "workflow_dispatch"]'), github.event_name) && steps.creds.outputs.available == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7
        push: ${{ github.event_name == 'release' && steps.creds.outputs.available == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        build-args: |
          GO_VERSION=${{ matrix.golang }}
          B2C_VERSION=${{ steps.ver.outputs.version }}
        labels: ${{ steps.meta.outputs.labels }}
        file: deploy/docker/Dockerfile${{ matrix.suffix }}

  build-plugins:
    runs-on: ${{ matrix.arch == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        plugin:
          - sinks/image
          - sinks/influx
          - sinks/influx2
          - sinks/zmq
          - sinks/kafka
          - sinks/sql
          - sinks/tdengine3
          - sources/random
          - sources/zmq
          - sources/sql
          - sources/video
          - sources/kafka
          - functions/accumulateWordCount
          - functions/countPlusOne
          - functions/echo
          - functions/image
          - functions/geohash
          - functions/labelImage
          - functions/tfLite
          - functions/onnx
        arch: ${{fromJson(needs.prepare.outputs.arch)}}
        os:
          - [ debian, "slim" ]
          - [ alpine, "alpine" ]
        golang:
          - 1.26.11
        exclude:
          - arch: linux/arm/v7
          - os: [ alpine,"alpine" ]
            plugin: functions/labelImage
          - os: [ alpine,"alpine" ]
            plugin: functions/tfLite
          - os: [ alpine,"alpine" ]
            plugin: functions/onnx

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build plugins
        run: |
          docker run -i --rm \
              -v $(pwd):/ekuiper \
              --workdir /ekuiper \
              --env GOTOOLCHAIN=auto \
              --platform ${{ matrix.arch }} \
              ghcr.io/lf-edge/ekuiper/base:${{ matrix.golang }}-${{ matrix.os[0] }} \
              bash -euc "git config --global --add safe.directory /ekuiper && make ${{ matrix.plugin }}"
      - name: Build ekuiper image
        uses: docker/build-push-action@v6
        if: matrix.arch == 'linux/amd64'
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docker.io/lfedge/ekuiper-${{ matrix.os[0] }}
          file: deploy/docker/Dockerfile-${{ matrix.os[1] }}
      - name: test docker and plugins
        if: matrix.arch == 'linux/amd64'
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -e -x -u
          plugin_type=$(echo ${PLUGIN%%/*})
          plugin_name=$(echo ${PLUGIN##*/})
          
          # REST API binds to 127.0.0.1 by default for security.
          # Expose it on all interfaces for the test, which reaches it from
          # the host via the container's bridge network address.
          container_id=$(docker run -u 0 -e KUIPER__BASIC__RESTIP=0.0.0.0 -e KUIPER__BASIC__ALLOWEXTERNALFILEACCESS=true -d -v $(pwd)/_plugins:/var/plugins docker.io/lfedge/ekuiper-${{ matrix.os[0] }})
          ip_address=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $container_id)
          os=$(docker exec -i ${container_id} sh -c "sed -n '/^ID=/p' /etc/os-release | sed -r 's/ID=(.*)/\1/g'" )
          sleep 5
          if ! curl ${ip_address}:9081  >/dev/null 2>&1; then echo "docker image failed"; exit 1; fi
          if [ "${plugin_name}" = "image" ]; then
              curl \
              ${ip_address}:9081/plugins/${plugin_type} \
              -X POST \
              -d "{\"name\":\"${plugin_name}\", \"file\":\"file:///var/plugins/${os}/${plugin_type}/${plugin_name}_amd64.zip\", \"functions\": [\"resize\",\"thumbnail\"]}"
          elif [ "${plugin_name}" = "geohash" ]; then
              curl \
              ${ip_address}:9081/plugins/${plugin_type} \
              -X POST \
              -d "{\"name\":\"${plugin_name}\", \"file\":\"file:///var/plugins/${os}/${plugin_type}/${plugin_name}_amd64.zip\", \"functions\": [\"geohashEncode\", \"geohashEncodeInt\", \"geohashDecode\", \"geohashDecodeInt\", \"geohashBoundingBox\", \"geohashBoundingBoxInt\", \"geohashNeighbor\", \"geohashNeighborInt\", \"geohashNeighbors\", \"geohashNeighborsInt\"]}"
          else
              curl \
              ${ip_address}:9081/plugins/${plugin_type} \
              -X POST \
              -d "{\"name\":\"${plugin_name}\", \"file\":\"file:///var/plugins/${os}/${plugin_type}/${plugin_name}_amd64.zip\"}"
          fi
          docker logs ${container_id}
          [ $plugin_name = $(curl ${ip_address}:9081/plugins/${plugin_type}/${plugin_name} | jq '.name'| sed 's/\"//g' ) ] || exit 1
      - name: Set artifact name
        id: artifact_name
        env:
          PLUGIN: ${{ matrix.plugin }}
          ARCH: ${{ matrix.arch }}
          REF: ${{ github.ref_name }}
        run: |
          plugin_type=$(echo ${PLUGIN%%/*})
          plugin_name=$(echo ${PLUGIN##*/})
          arch=$(echo $ARCH | sed -r 's|linux/([a-z]*)(/.*)*|\1|g')
          ref=$(echo ${REF/\//-})

          artifact_name="plugin-${ref}-${{ matrix.os[0] }}-${plugin_type}-${plugin_name}-${arch}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.artifact_name }}
          path: _plugins/

  build-kubernetes-tool:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: docker/setup-buildx-action@v3
    - uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:qemu-v9.2.2-52
        platforms: all
    - name: Build single platform image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: docker.io/lfedge/ekuiper-kubernetes-tool
        file: deploy/docker/Dockerfile-kubernetes-tool
    - name: Test docker image
      run: |
        docker run -d --name kuiper-kubernetes-tool docker.io/lfedge/ekuiper-kubernetes-tool
        sleep 5
        if [[ "$(docker logs kuiper-kubernetes-tool)" != *"Kuiper kubernetes tool is started successfully!"*  ]]; then exit 1; fi
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: docker.io/lfedge/ekuiper-kubernetes-tool
        flavor: |
          latest=${{ github.event_name == 'release' && !github.event.release.prerelease}}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - name: Check registry credentials
      id: creds
      env:
        HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      run: |
        if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
          echo "available=true" >> $GITHUB_OUTPUT
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "::warning::DOCKER_HUB_USER / DOCKER_HUB_TOKEN 未配置，跳过镜像推送"
        fi
    - uses: docker/login-action@v2
      if: github.event_name == 'release' && steps.creds.outputs.available == 'true'
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    - name: Update version for setup.py
      if: github.event_name == 'release'
      run: sed -i -r "s|([ \t]*version=).*|\1'${GITHUB_REF#refs/tags/}',|1" sdk/python/setup.py
    # 同 build-docker-images: 无推送凭据时跳过跨架构构建，只保留上面的单平台
    # 构建与启动测试。
    - name: Build multi platform image
      if: steps.creds.outputs.available == 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
        push: ${{ github.event_name == 'release' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        file: deploy/docker/Dockerfile-kubernetes-tool

  release:
    if: contains(fromJSON('["release", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    needs:
    - build
    - build-on-mac
    - build-plugins

    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: kuiper-*
        path: _packages
        merge-multiple: true
    - uses: actions/download-artifact@v4
      with:
        pattern: plugin-*
        path: _plugins
        merge-multiple: true
    - name: check packages
      run: |
        cd _packages && for var in $( ls |grep -v sha256); do
          echo "$(cat $var.sha256) $var" | sha256sum -c || exit 1
        done
    # 上游这里把产物发到 lf-edge/ekuiper 的 release 以及 packages.emqx 的 S3。
    # 本 fork 两者都不存在: 没有那个仓库的写权限，也没有 S3/CloudFront/EMQX 凭据，
    # 照原样跑必然失败，产物也不会落到本仓库的 release。改成挂到本仓库自己的
    # release，同时把上游发布目标在缺凭据时明确跳过而不是判红。
    - name: Collect release assets
      run: |
        set -eu
        mkdir -p _dist
        for f in _packages/kuiper*; do
          case "$f" in *.sha256) continue;; esac
          cp "$f" _dist/
        done
        if [ -d _plugins ]; then
          tar czf "_dist/b2c-plugins-${GITHUB_REF_NAME}.tar.gz" -C _plugins .
        fi
        ls -l _dist
    - name: Upload assets to this release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: _dist/*
        fail_on_unmatched_files: false
    - name: Publish to upstream targets when credentials exist
      env:
        AWS_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        EMQX_TOKEN: ${{ secrets.EMQX_IO_TOKEN }}
        EMQX_API: ${{ secrets.EMQX_IO_RELEASE_API }}
      run: |
        set -eu
        missing=""
        [ -z "${AWS_ID:-}" ] && missing="$missing AWS_ACCESS_KEY_ID"
        [ -z "${AWS_KEY:-}" ] && missing="$missing AWS_SECRET_ACCESS_KEY"
        [ -z "${EMQX_TOKEN:-}" ] && missing="$missing EMQX_IO_TOKEN"
        [ -z "${EMQX_API:-}" ] && missing="$missing EMQX_IO_RELEASE_API"
        if [ -n "$missing" ]; then
          echo "::warning::未配置${missing}，跳过上游 S3 同步与 ekuiper.org 更新；产物已挂到本仓库 release"
          exit 0
        fi
        version="${GITHUB_REF_NAME}"
        aws configure set aws_access_key_id "$AWS_ID"
        aws configure set aws_secret_access_key "$AWS_KEY"
        aws configure set default.region us-west-2
        aws s3 rm --quiet --recursive "s3://packages.emqx/kuiper/$version"
        aws s3 cp --quiet --recursive ./_packages "s3://packages.emqx/kuiper/$version"
        aws s3 cp --quiet --recursive ./_plugins "s3://packages.emqx/kuiper-plugins/$version"
        aws cloudfront create-invalidation --distribution-id E170YEULGLT8XB --paths "/kuiper/$version/*,/kuiper-plugins/$version/*"
        curl -fvs -w '%{http_code}' --insecure           -H "Content-Type: application/json"           -H "token: $EMQX_TOKEN"           -X POST           -d "{\"repo\":\"lf-edge/ekuiper\", \"tag\": \"$version\" }"           "$EMQX_API"
    - uses: geekyeggo/delete-artifact@v5
      with:
        name: "*"
